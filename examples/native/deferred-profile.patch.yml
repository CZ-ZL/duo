- id: duo-controller
  disabled: true
- id: duo-observer
  disabled: true
- id: duo-observer-tools
  disabled: true
- id: dualloop
  disabled: true
- insert:
    - id: duo-deferred-runtime
      name: '@dual-loop/dsh-plugin/deferred-runtime'
      config:
        evaluationOnly: false
