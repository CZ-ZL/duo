name: Product verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The bounded evaluator needs unprivileged namespace UID mapping. The
    # attempted ubuntu-24.04 image rejected /proc/self/uid_map; do not disable
    # its security policy or fall back to running candidate code on the host.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install PyYAML==6.0.2 pytest==9.0.3
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.24.0
          npm install --prefix "$RUNNER_TEMP/duo-dsh" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.2-rc.1
          echo "DUO_DSH_PACKAGE=$RUNNER_TEMP/duo-dsh/node_modules/@deepseek-ai/dsh" >> "$GITHUB_ENV"
      - name: Verify without model credentials
        run: bash scripts/release_gate.sh "$RUNNER_TEMP/duo-release-check"
      - name: Retain verification evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: linux-product-evidence
          # Keep the evidence and package, without traversing temporary profiles
          # or their node_modules links back to the complete host installation.
          path: |
            ${{ runner.temp }}/duo-release-check/*.log
            ${{ runner.temp }}/duo-release-check/*.json
            ${{ runner.temp }}/duo-release-check/*.tgz
            ${{ runner.temp }}/duo-release-check/verify/*.json
            ${{ runner.temp }}/duo-release-check/verify/*.stdout.txt
            ${{ runner.temp }}/duo-release-check/verify/*.stderr.txt
            ${{ runner.temp }}/duo-release-check/install/*.json
            ${{ runner.temp }}/duo-release-check/install/*.txt
            ${{ runner.temp }}/duo-release-check/public-examples/*.json
            ${{ runner.temp }}/duo-release-check/public-examples/*.txt
          if-no-files-found: warn
