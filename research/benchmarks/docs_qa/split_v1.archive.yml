  notes: "providers.md line 13: settings keep only the credential reference, value lives in `$DSH_HOME/.credentials.yaml`. credentials.md line 5: 'consumers resolve a reference once per operation — the LLM adapters resolve once per model request, so a rotated credential reaches the very next request without any restart'; line 20: consumers 're-resolve at each operation'."

