- id: sy-07
  type: synthesis
  question: "How does a rotated provider credential reach the very next model request without a restart, given how DSH stores and resolves credentials?"
  gold_answer_keys: ["reference", "resolve", "per operation"]
  gold_files: ["user/guide/providers.md", "subsystems/credentials.md"]
  notes: "providers.md line 13: settings keep only the credential reference, value lives in `$DSH_HOME/.credentials.yaml`. credentials.md line 5: 'consumers resolve a reference once per operation'; line 20: consumers 're-resolve at each operation'."

- id: sy-08
  type: synthesis
  question: "How are Schedule reminders delivered to the user, and what happens to a session's reminders when that session is forked?"
  gold_answer_keys: ["follow-up", "does not inherit"]
  gold_files: ["subsystems/schedule.md", "user/guide/schedule.md"]
  notes: "subsystems/schedule.md line 5: reminders 'return to the original live Session as ordinary later conversation turns'; guide line 17: a live root Agent 'queues a normal follow-up turn', and 'a fork does not inherit its parent's reminders'."

- id: sy-11
  type: synthesis
  question: "A plugin should give the model a confined shell capability. Across the tool and shell seams, which `ctx` services and which packages fill the Service Definition, Service Provider, and Consumer roles, and which backend service wraps the spawned argv to confine it?"
  gold_answer_keys: ["ctx.tools", "dsh-shell", "dsh-tool-bash", "ctx.sandbox"]
  gold_files: ["architecture.md", "subsystems/shell.md", "subsystems/sandbox.md"]
  notes: "3 pages. shell.md line 5: Service Definition dsh-shell (`ctx.shell`), Providers dsh-bash-local/dsh-bash-sandbox, Consumer dsh-tool-bash. architecture.md lines 126/128/134: model-facing capabilities register on `ctx.tools`; shell execution registers a `ctx.shell` backend; confinement uses a `ctx.sandbox` backend whose consumers wrap argv. sandbox.md line 5: the seam wraps a same-world subprocess argv."

- id: sy-13
  type: synthesis
  question: "Trace a provider API key end-to-end: which shared bundle layer carries the credential seam, where is the key value stored on disk, what do settings keep instead of the key, and which error does the Models guide list when the credential is missing?"
  gold_answer_keys: ["dsh-base", ".credentials.yaml", "credential reference", "MISSING_CREDENTIAL"]
  gold_files: ["architecture.md", "user/guide/providers.md", "subsystems/credentials.md"]
  notes: "3 pages. architecture.md line 25: dsh-base includes 'settings, credentials, telemetry'. providers.md line 13: key in `$DSH_HOME/.credentials.yaml`, settings keep the credential reference; line 126: `MISSING_CREDENTIAL` troubleshooting entry. credentials.md lines 5, 11-16: references, not values, live in configuration."

- id: sy-15
  type: synthesis
  question: "Which `compaction/*` session events are log-only and deliberately excluded from the model surface, through what replacement mechanism does the summary still reach the model, and which architecture-level invariant requires that anything model-visible be reconstructable from the log?"
  gold_answer_keys: ["log-only", "surfaceOp", "user/message", "model-visible means logged"]
  gold_files: ["subsystems/compaction.md", "subsystems/llm-streaming.md", "architecture.md"]
  notes: "3 pages + exclusion. compaction.md line 11: all three compaction/* events are log-only and `SurfaceEventType` is deliberately NOT extended; the summary rides a `user/message` with `surfaceOp: { op: 'replace', ... }`; line 5: the summary event uses the `ContentBlock` vocabulary owned by llm-streaming.md lines 22-28. architecture.md line 107: 'Model-visible means logged.'"

