  gold_files: ["user/develop/basic/tool.md"]
  notes: "tool.md line 46: 'Open `http://127.0.0.1:3080` and ask: ...'. Corroborated by user/guide/github-review.md line 42 and upstream README line 27."

- id: sf-02
