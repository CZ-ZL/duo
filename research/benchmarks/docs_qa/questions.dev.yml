  notes: "providers.md lines 35-48: add `input: [text, image]` to the model in `$DSH_HOME/settings.yaml`. token-meter.md line 29: images 'are priced as the visual tokens plus model-visible text the request actually sends' when the route declares pricing."

- id: sy-03
