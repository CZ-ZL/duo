- id: sy-02
  type: synthesis
  question: "How do you declare image input for a hand-entered model on a custom provider, and how does the token meter then price each retained image on a route whose adapter declares image pricing?"
  gold_answer_keys: ["input", "text, image", "visual tokens"]
