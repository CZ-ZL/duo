[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualloop"
version = "0.1.0"
description = "DualLoop Phase A: dual-loop autonomous optimization protocol core (offline, mock-capable)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["dualloop*"]
